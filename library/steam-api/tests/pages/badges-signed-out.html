<!DOCTYPE html>
<!-- A badge page as steamcommunity.com shows it to its owner (?l=english),
     trimmed to what steamcards reads, and modelled on the markup ASF's
     selectors read. Replace with a saved live page once one is at hand. -->
<html>
<head>
<title>Steam Community :: cardfarmer :: Badges</title>
<script type="text/javascript">
	g_sessionID = "0123456789abcdef01234567";
	g_steamID = false;
</script>
</head>
<body class="flat_page responsive_page">
<div class="profile_small_header_bg">
	<span class="profile_small_header_name"><a class="whiteLink" href="https://steamcommunity.com/id/cardfarmer">cardfarmer</a></span>
	<span class="profile_small_header_arrow">&raquo;</span>
	<span class="profile_small_header_location">Badges</span>
</div>
<div class="badges_sheet">
	<div class="badge_row is_link">
		<a class="badge_row_overlay" href="https://steamcommunity.com/id/cardfarmer/gamecards/620/"></a>
		<div class="badge_row_inner">
			<div class="badge_title_row">
				<div class="badge_title_stats">
					<div class="badge_title_stats_content">
						<div class="badge_title_stats_playtime">
							&nbsp;5.2 hrs on record
						</div>
						<div class="badge_title_stats_drops">
							<span class="progress_info_bold"></span>
							<div style="clear: left;"></div>
							<div class="card_drop_info_link" onclick="ToggleCardDropInfo(620);">Card drop info</div>
						</div>
						<div class="card_drop_info_dialog" id="card_drop_info_gamebadge_620_1_0" style="display: none;">
							<div class="card_drop_info_header">Card drops received: 0</div>
						</div>
					</div>
				</div>
				<div class="badge_title">
					Portal 2&nbsp;<span class="badge_view_details">View details</span>
				</div>
			</div>
			<div class="badge_title_rule"></div>
			<div class="badge_current">
				<div class="badge_info">
					<div class="badge_info_description">
						<div class="badge_info_title">Trading card badge</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
</body>
</html>
