<!DOCTYPE html>
<!-- A game's foil badge page (/gamecards/730?border=1&l=english), trimmed to
     what steamcards reads, modelled on the normal card page: its set is the
     game's foils, and how many of each the account has. -->
<html>
<head>
<script type="text/javascript">
	g_steamID = "76561197960287930";
</script>
</head>
<body>
<div class="profile_small_header_bg">
	<span class="profile_small_header_name"><a class="whiteLink" href="https://steamcommunity.com/id/cardfarmer">cardfarmer</a></span>
	<span class="profile_small_header_arrow">&raquo;</span>
	<a class="whiteLink" href="https://steamcommunity.com/id/cardfarmer/badges/"><span class="profile_small_header_location">Badges</span></a>
	<span class="profile_small_header_arrow">&raquo;</span>
	<span class="profile_small_header_location">Counter-Strike 2</span>
</div>
<div class="badge_detail_tasks">
	<div class="badge_card_set_cards">
		<div class="badge_card_set_card owned">
			<div class="game_card_ctn"><img class="gamecard" src="https://community.akamai.steamstatic.com/economy/image/foil1"></div>
			<div class="badge_card_set_text ellipsis">
				<div class="badge_card_set_text_qty">(2)</div>Anarchist
			</div>
			<div class="badge_card_set_text game_card_unowned_border">1 of 5</div>
		</div>
		<div class="badge_card_set_card unowned">
			<div class="game_card_ctn"><img class="gamecard" src="https://community.akamai.steamstatic.com/economy/image/foil2"></div>
			<div class="badge_card_set_text ellipsis">Balkan</div>
			<div class="badge_card_set_text">2 of 5</div>
		</div>
		<div class="badge_card_set_card owned">
			<div class="game_card_ctn"><img class="gamecard" src="https://community.akamai.steamstatic.com/economy/image/foil3"></div>
			<div class="badge_card_set_text ellipsis">FBI (Foil)</div>
			<div class="badge_card_set_text">3 of 5</div>
		</div>
		<div class="badge_card_set_card unowned">
			<div class="game_card_ctn"><img class="gamecard" src="https://community.akamai.steamstatic.com/economy/image/foil4"></div>
			<div class="badge_card_set_text ellipsis">Phoenix</div>
			<div class="badge_card_set_text">4 of 5</div>
		</div>
		<div class="badge_card_set_card unowned">
			<div class="game_card_ctn"><img class="gamecard" src="https://community.akamai.steamstatic.com/economy/image/foil5"></div>
			<div class="badge_card_set_text ellipsis">SAS</div>
			<div class="badge_card_set_text">5 of 5</div>
		</div>
	</div>
</div>
</body>
</html>
