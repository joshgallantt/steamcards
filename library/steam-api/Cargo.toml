[package]
name = "steam-api"
description = "Steam in Steam's own vocabulary: the CM connection, sign-in, playing games, badge pages, the inventory's items, the wallet and the market's prices."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# A stand-in for Steam, for other crates' tests. Never on in the binary.
test-support = []

[dependencies]
config-file.workspace = true
debug-log.workspace = true
anyhow.workspace = true
base64.workspace = true
flate2.workspace = true
futures.workspace = true
hex.workspace = true
prost.workspace = true
rand.workspace = true
reqwest.workspace = true
scraper.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tokio-util.workspace = true

[dev-dependencies]
steam-api = { path = ".", features = ["test-support"] }
# The market's pace, on paused time.
tokio = { workspace = true, features = ["test-util"] }
wiremock.workspace = true
