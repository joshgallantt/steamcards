[package]
name = "price"
description = "What the user's cards are worth on the Steam market: prices, the wallet, the value basis, and Steam's pause on price lookups."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Doubles for other crates' tests. Never depends on price-data.
test-support = []

[dependencies]
game.workspace = true
card.workspace = true
money.workspace = true
anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
tokio.workspace = true
tokio-util.workspace = true

[dev-dependencies]
price = { path = ".", features = ["test-support"] }
game = { workspace = true, features = ["test-support"] }
card = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }
