[package]
name = "steam-library"
description = "The Steam library: the user's games that have trading cards, each with its hours and card drops."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Doubles for other crates' tests. Never depends on steam-library-data.
test-support = []

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
tokio.workspace = true

[dev-dependencies]
steam-library = { path = ".", features = ["test-support"] }
