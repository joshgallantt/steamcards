[package]
name = "farming"
description = "Playing the user's games so their trading cards drop (which, in what order, and how), and the session that makes: every card that dropped, which it was, and how long the rest should take."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Doubles for other crates' tests. Never depends on farming-data.
test-support = []

[dependencies]
game.workspace = true
card.workspace = true
preferences.workspace = true
anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
tokio.workspace = true
tokio-util.workspace = true

[dev-dependencies]
farming = { path = ".", features = ["test-support"] }
preferences = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }
