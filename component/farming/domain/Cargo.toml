[package]
name = "farming"
description = "Which of the user's games still drop cards, and playing them until they don't."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Doubles for other crates' tests. Never depends on farming-data.
test-support = []

[dependencies]
preferences.workspace = true
anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
tokio.workspace = true
tokio-util.workspace = true

[dev-dependencies]
farming = { path = ".", features = ["test-support"] }
preferences = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }
