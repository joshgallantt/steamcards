[package]
name = "xtask"
description = "Project tooling: `cargo xtask ci` runs what CI runs, locally."
# Its own version, not the workspace's: a release bumps that while xtask is
# running, and Windows can't rebuild a program that's running.
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true
